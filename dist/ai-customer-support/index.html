<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Customer Support Assistant & Router</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">⚡ AI SupportDesk Pro</div>
      <p class="subtitle">Commercial AI Customer Support Triage & Ticket Router</p>
    </header>

    <main class="grid-layout">
      <section class="card input-card">
        <h2>Submit Support Ticket</h2>
        <form id="ticket-form">
          <div class="form-group">
            <label for="customer-name">Customer Name</label>
            <input type="text" id="customer-name" placeholder="e.g. Alice Smith" required>
          </div>
          <div class="form-group">
            <label for="ticket-category">Category</label>
            <select id="ticket-category" required>
              <option value="billing">Billing & Subscription</option>
              <option value="technical">Technical Bug / Outage</option>
              <option value="feature">Feature Request</option>
              <option value="account">Account Access</option>
            </select>
          </div>
          <div class="form-group">
            <label for="ticket-msg">Ticket Message</label>
            <textarea id="ticket-msg" rows="4" placeholder="Describe the customer inquiry..." required></textarea>
          </div>
          <button type="submit" id="analyze-btn" class="btn primary">⚡ Analyze & Route Ticket</button>
        </form>
      </section>

      <section class="card output-card">
        <h2>AI Analysis & Recommended Action</h2>
        <div id="loading" class="hidden">⚡ Bolt Processing AI Triage...</div>
        <div id="analysis-result" class="result-box">
          <p class="placeholder-text">Submit a ticket on the left to see instant AI classification, sentiment, routing, and drafted response.</p>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
