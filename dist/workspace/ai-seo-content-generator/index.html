<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI SEO Content Generator</title>
  <style>
    :root {
      --primary: #059669;
      --bg: #f0fdf4;
      --card: #ffffff;
      --text: #064e3b;
      --border: #a7f3d0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .badge {
      display: inline-block;
      background: #d1fae5;
      color: #065f46;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    textarea { height: 120px; resize: vertical; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #047857; }
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
    }
    .density-tag {
      display: inline-block;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 4px 8px;
      border-radius: 4px;
      margin: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">Malt MVP • 500€ - 700€/j</span>
      <h1>AI SEO Content Generator 🚀</h1>
      <p>Génération d'articles SEO et analyse de densité de mots-clés en temps réel.</p>
    </header>

    <main>
      <label for="keyword-input"><strong>Mot-clé principal :</strong></label>
      <input type="text" id="keyword-input" placeholder="Ex: Intelligence Artificielle entreprise">

      <label for="content-input"><strong>Brouillon de l'article :</strong></label>
      <textarea id="content-input" placeholder="Tapez ou collez votre contenu ici..."></textarea>

      <button id="generate-btn">Générer Structure & Optimiser</button>

      <div class="result-card" id="output-card" style="display: none;">
        <h3>Analyse SEO & Recommandations</h3>
        <p id="word-count"></p>
        <p><strong>Mots-clés fréquents (Densité) :</strong></p>
        <div id="density-container"></div>
        <div style="font-size: 12px; color: #047857; margin-top: 12px;" id="perf-metrics"></div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
