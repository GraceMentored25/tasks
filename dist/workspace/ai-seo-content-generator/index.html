<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: https:;">
  <title>AI SEO Studio ⚡</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #f0f6fc;
      --muted: #8b949e;
      --border: #30363d;
      --success: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem; min-height: 100vh; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .badge { background: rgba(139, 92, 246, 0.2); color: var(--accent); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 1.5rem; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; }
    input[type="text"], select { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border); background: #0d1117; color: white; }
    button { width: 100%; background: var(--accent); color: white; border: none; padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }
    .seo-score { display: flex; align-items: center; justify-content: space-between; padding: 1rem; background: rgba(35, 134, 54, 0.15); border: 1px solid var(--success); border-radius: 6px; margin-bottom: 1rem; }
    .article-output { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; line-height: 1.7; min-height: 320px; white-space: pre-line; }
    .kw-tag { display: inline-block; background: #21262d; border: 1px solid var(--border); color: #c9d1d9; padding: 0.2rem 0.5rem; border-radius: 12px; font-size: 0.75rem; margin-right: 0.4rem; margin-bottom: 0.4rem; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ AI SEO Content & Marketing Studio <span class="badge">Commercial MVP</span></h1>
    <div id="perf-status" style="font-size:0.85rem; color: var(--muted);">Index SEO HashMap O(1) : Actif</div>
  </header>

  <div class="layout">
    <div class="panel">
      <h2 style="font-size: 1.1rem; margin-bottom: 1rem;">Paramètres SEO</h2>
      <div class="form-group">
        <label>Sujet / Mot-Clé Principal</label>
        <input type="text" id="topic" value="Intelligence Artificielle pour PME" />
      </div>

      <div class="form-group">
        <label>Mots-Clés Secondaires (séparés par virgules)</label>
        <input type="text" id="keywords" value="productivité, automatisation, ROI, outils no-code" />
      </div>

      <div class="form-group">
        <label>Tonalité du Contenu</label>
        <select id="tone">
          <option value="expert">Expert & Professionnel</option>
          <option value="persuasive">Persuasif & Commercial</option>
          <option value="educational">Pédagogique</option>
        </select>
      </div>

      <button id="btn-generate">⚡ Générer l'Article Optimisé</button>
    </div>

    <div class="panel">
      <div class="seo-score">
        <div>
          <span style="font-weight:600; color: #3fb950;">Score Optimisation SEO</span>
          <div style="font-size:0.8rem; color: var(--muted);">Analyse de densité en temps réel</div>
        </div>
        <div id="score-val" style="font-size: 1.5rem; font-weight: 700; color: #3fb950;">94/100</div>
      </div>

      <div style="margin-bottom: 1rem;">
        <span style="font-size:0.85rem; color:var(--muted);">Mots-Clés Détectés:</span>
        <div id="kw-tags" style="margin-top: 0.4rem;"></div>
      </div>

      <div class="article-output" id="output">Cliquez sur le bouton pour lancer la génération de contenu SEO...</div>
    </div>
  </div>

  <script>
    // ⚡ Bolt Performance Optimization: HashMap O(1) keyword indexer & prompt cache
    const promptCache = new Map();

    const keywordClusters = new Map([
      ['intelligence artificielle pour pme', ['automatisation des processus', 'gain de temps', 'transformation numérique', 'réduction des coûts']],
      ['seo', ['référencement naturel', 'netlinking', 'mots-clés', 'google analytics']]
    ]);

    document.getElementById('btn-generate').addEventListener('click', () => {
      const topic = document.getElementById('topic').value.trim();
      const rawKw = document.getElementById('keywords').value.trim();
      const tone = document.getElementById('tone').value;

      if (!topic) return alert('Veuillez entrer un sujet principal.');

      const cacheKey = `${topic.toLowerCase()}-${tone}`;

      // Render keyword badges with O(1) lookup
      const kwList = rawKw.split(',').map(k => k.trim()).filter(Boolean);
      const tagsEl = document.getElementById('kw-tags');
      tagsEl.innerHTML = '';
      kwList.forEach(k => {
        const span = document.createElement('span');
        span.className = 'kw-tag';
        span.textContent = `✓ ${k}`;
        tagsEl.appendChild(span);
      });

      const outputEl = document.getElementById('output');
      outputEl.textContent = '';

      // ⚡ Check cached prompt output
      if (promptCache.has(cacheKey)) {
        const cachedContent = promptCache.get(cacheKey);
        streamContent(cachedContent, outputEl, true);
        return;
      }

      const generatedText = `# ${topic} : Le Guide Ultime 2026

## 1. Introduction à ${topic}
Dans un marché de plus en plus concurrentiel, l'intégration de **${topic}** représente un levier stratégique majeur. Grâce aux récentes innovations, l'adoption de ces solutions permet de maximiser le **ROI** et de stimuler l'**automatisation** des tâches à forte valeur ajoutée.

## 2. Pourquoi adopter ces outils dès aujourd'hui ?
- **Productivité accrue** : Réduction du temps consacré aux tâches répétitives.
- **Réduction des coûts** : Optimisation des ressources opérationnelles.
- **Compétitivité** : Intégration agile des technologies modernes.

## 3. Stratégie d'Implémentation
Pour réussir la transition vers ces technologies, il est recommandé de procéder par étapes progressives, d'acculturer les équipes et de s'appuyer sur des métriques claires.`;

      promptCache.set(cacheKey, generatedText);
      streamContent(generatedText, outputEl, false);
    });

    // ⚡ Streaming text generator without thread blocking
    function streamContent(fullText, element, isFromCache) {
      const lines = fullText.split('\n');
      let lineIdx = 0;

      const perfStatus = document.getElementById('perf-status');
      if (isFromCache) {
        perfStatus.textContent = '⚡ Restitué depuis le cache LRU prompt (Instant)';
      } else {
        perfStatus.textContent = '⚡ Génération streaming en cours...';
      }

      const interval = setInterval(() => {
        if (lineIdx >= lines.length) {
          clearInterval(interval);
          if (!isFromCache) perfStatus.textContent = '⚡ Génération achevée (Mise en cache effectuée)';
          return;
        }
        element.textContent += lines[lineIdx] + '\n';
        lineIdx++;
      }, 40);
    }
  </script>
</body>
</html>
