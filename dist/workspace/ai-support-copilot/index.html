<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Support Copilot</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .badge {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #1d4ed8;
    }
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
    }
    .metrics {
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">Malt MVP • 550€ - 750€/j</span>
      <h1>AI Support Copilot ⚡</h1>
      <p>Assistance automatique et génération de réponses intelligentes pour le support client.</p>
    </header>

    <main>
      <label for="ticket-input"><strong>Ticket Client (Description du problème) :</strong></label>
      <textarea id="ticket-input" placeholder="Ex: Client signale un problème de facturation double sur sa commande #1234..."></textarea>
      <button id="analyze-btn">Analyser & Générer Réponse</button>

      <div class="result-card" id="output-card" style="display: none;">
        <h3>Suggestion de réponse GenAI :</h3>
        <p id="response-text"></p>
        <div class="metrics" id="perf-metrics"></div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
