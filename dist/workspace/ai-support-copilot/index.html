<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Support Copilot | Smart Agent Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .header { max-width: 1100px; margin: 0 auto 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.5rem; color: var(--primary); }
    .badge { background: #0284c7; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
    .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .panel h2 { font-size: 1.1rem; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    textarea { width: 100%; height: 180px; background: #090d16; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 12px; font-size: 0.95rem; resize: vertical; outline: none; }
    textarea:focus { border-color: var(--primary); }
    .stats { display: flex; gap: 12px; font-size: 0.85rem; color: var(--text-muted); }
    .stat-box { background: #090d16; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); flex: 1; text-align: center; }
    .stat-val { color: var(--primary); font-weight: bold; font-size: 1rem; }
    .suggestions { display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto; }
    .suggestion-card { background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.2s; }
    .suggestion-card:hover { border-color: var(--primary); background: #131c2e; }
    .confidence { font-size: 0.75rem; color: var(--accent); float: right; }
    .btn { background: var(--primary); color: #000; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ Support Copilot AI</h1>
    <span class="badge">Commercial MVP (550€-750€/j)</span>
  </div>

  <div class="container">
    <div class="panel">
      <h2>1. Incoming Customer Ticket</h2>
      <label for="ticketInput" style="font-size:0.85rem; color: var(--text-muted)">Type or paste customer inquiry:</label>
      <textarea id="ticketInput" placeholder="e.g., I was charged twice for my monthly subscription and need a refund immediately..."></textarea>

      <div class="stats">
        <div class="stat-box">Detected Intent<div id="intentTag" class="stat-val">--</div></div>
        <div class="stat-box">Sentiment<div id="sentimentTag" class="stat-val">--</div></div>
        <div class="stat-box">Latency<div id="latencyTag" class="stat-val">0ms</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>2. AI Recommended Copilot Responses</h2>
      <div id="suggestionsList" class="suggestions">
        <div style="color: var(--text-muted); font-size: 0.9rem;">Start typing a customer query to receive real-time AI copilot suggestions...</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
