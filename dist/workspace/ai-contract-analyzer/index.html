<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Legal Contract Auditor</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2a;
      --border: #2a364f;
      --primary: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .header { max-width: 1100px; margin: 0 auto 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.5rem; color: var(--primary); }
    .badge { background: #0284c7; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
    .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .panel h2 { font-size: 1.1rem; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    textarea { width: 100%; height: 220px; background: #080c14; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 12px; font-size: 0.9rem; resize: vertical; outline: none; line-height: 1.5; }
    textarea:focus { border-color: var(--primary); }
    .btn { background: var(--primary); color: #000; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: #0284c7; color: white; }
    .metrics { display: flex; gap: 12px; }
    .metric-card { background: #080c14; border: 1px solid var(--border); border-radius: 8px; padding: 10px; flex: 1; text-align: center; }
    .metric-val { font-size: 1.2rem; font-weight: bold; margin-top: 4px; }
    .clause-list { display: flex; flex-direction: column; gap: 12px; max-height: 380px; overflow-y: auto; }
    .clause-card { background: #080c14; border-left: 4px solid var(--border); border-radius: 6px; padding: 12px; }
    .clause-card.high { border-left-color: var(--danger); }
    .clause-card.medium { border-left-color: var(--warning); }
    .clause-card.low { border-left-color: var(--success); }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ Legal AI Contract Auditor</h1>
    <span class="badge">Commercial MVP (600€-850€/j)</span>
  </div>

  <div class="container">
    <div class="panel">
      <h2>1. Upload or Paste Legal Agreement</h2>
      <label for="contractInput" style="font-size:0.85rem; color: var(--text-muted)">Paste NDA, Service Agreement, or Freelance Contract:</label>
      <textarea id="contractInput" placeholder="Paste legal text here... E.g., The Contractor agrees to indemnify and hold harmless the Client against all claims without limitation of liability. All intellectual property generated prior to or during the term shall belong exclusively to the Client in perpetuity..."></textarea>

      <button id="analyzeBtn" class="btn">⚡ Run AI Risk Audit</button>

      <div class="metrics">
        <div class="metric-card">Risk Score<div id="riskScore" class="metric-val" style="color:var(--text-muted)">--</div></div>
        <div class="metric-card">Clauses Analyzed<div id="clausesCount" class="metric-val" style="color:var(--primary)">0</div></div>
        <div class="metric-card">Audit Speed<div id="auditSpeed" class="metric-val" style="color:var(--success)">0ms</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>2. Risk Analysis & Recommendations</h2>
      <div id="clauseList" class="clause-list">
        <div style="color: var(--text-muted); font-size: 0.9rem;">Click 'Run AI Risk Audit' to process the contract clauses.</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
