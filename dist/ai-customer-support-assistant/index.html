<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Customer Support Assistant & Ticket Classifier</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #151c2c;
      --accent: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
      --high: #ef4444;
      --med: #f59e0b;
      --low: #10b981;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    h1 { margin: 0 0 0.5rem 0; color: var(--accent); }
    .badge {
      display: inline-block;
      background: rgba(129, 140, 248, 0.1);
      color: var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      border: 1px solid var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1.5rem;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--text);
      padding: 0.75rem;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
    }
    .pill {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .pill-high { background: rgba(239, 68, 68, 0.2); color: var(--high); }
    .pill-med { background: rgba(245, 158, 11, 0.2); color: var(--med); }
    .pill-low { background: rgba(16, 185, 129, 0.2); color: var(--low); }
    .reply-box {
      background: var(--bg);
      padding: 1rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      margin-top: 1rem;
      white-space: pre-wrap;
    }
    .perf-tag {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #34d399;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛡️ AI Customer Support Assistant</h1>
      <span class="badge">Malt Ref: MALT-441209 | TJM: €750/day</span>
    </header>

    <div class="grid">
      <div class="card">
        <h2>Customer Inbound Inquiry</h2>
        <textarea id="ticketInput" placeholder="Paste incoming email or customer support ticket (e.g., 'My payment failed, I need an immediate refund!')..."></textarea>
      </div>

      <div class="card">
        <h2>Classification & Auto-Reply</h2>
        <div id="results">
          <p style="color: var(--muted)">Enter a support message to see instant urgency classification and response drafting.</p>
        </div>
        <div id="perfMetrics" class="perf-tag"></div>
      </div>
    </div>
  </div>

  <script>
    // Pre-compiled keyword map for fast O(1) matching
    const CATEGORIES = [
      { name: 'Billing / Refund', keywords: ['refund', 'billing', 'charge', 'invoice', 'payment', 'subscription'], urgency: 'HIGH' },
      { name: 'Technical Support', keywords: ['error', 'bug', 'broken', 'fail', 'crash', 'login', 'access'], urgency: 'HIGH' },
      { name: 'Feature Request', keywords: ['feature', 'add', 'would be nice', 'suggest', 'improve'], urgency: 'LOW' },
      { name: 'General Inquiry', keywords: ['how', 'info', 'pricing', 'question', 'contact'], urgency: 'MED' }
    ];

    function classifyTicket(text) {
      const lower = text.toLowerCase();
      let matchedCategory = CATEGORIES[3]; // Default: General Inquiry
      let maxScore = 0;

      for (const cat of CATEGORIES) {
        let score = 0;
        for (const kw of cat.keywords) {
          if (lower.includes(kw)) score++;
        }
        if (score > maxScore) {
          maxScore = score;
          matchedCategory = cat;
        }
      }

      const urgency = matchedCategory.urgency;
      let template = '';
      if (matchedCategory.name === 'Billing / Refund') {
        template = "Hello, thanks for reaching out. We apologize for any inconvenience. I have flagged your billing inquiry to our finance team for immediate processing within 1 business day.";
      } else if (matchedCategory.name === 'Technical Support') {
        template = "Hi there, thank you for reporting this technical issue. Could you please share your browser version and a screenshot so our dev team can investigate right away?";
      } else {
        template = "Thank you for reaching out! We have received your inquiry and our customer support team will follow up with details shortly.";
      }

      return { category: matchedCategory.name, urgency, template };
    }

    const ticketInput = document.getElementById('ticketInput');
    const resultsDiv = document.getElementById('results');
    const perfMetricsDiv = document.getElementById('perfMetrics');

    let timer;
    ticketInput.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const text = ticketInput.value.trim();
        if (!text) {
          resultsDiv.innerHTML = '<p style="color: var(--muted)">Enter a support message to see instant urgency classification and response drafting.</p>';
          perfMetricsDiv.innerText = '';
          return;
        }

        const t0 = performance.now();
        const res = classifyTicket(text);
        const t1 = performance.now();

        const pillClass = res.urgency === 'HIGH' ? 'pill-high' : res.urgency === 'MED' ? 'pill-med' : 'pill-low';

        resultsDiv.innerHTML = `
          <div style="margin-bottom: 0.75rem;">
            <strong>Category:</strong> ${res.category} <br>
            <strong>Urgency:</strong> <span class="pill ${pillClass}">${res.urgency}</span>
          </div>
          <strong>Suggested Auto-Response:</strong>
          <div class="reply-box">${res.template}</div>
        `;

        perfMetricsDiv.innerText = `⚡ Classification time: ${(t1 - t0).toFixed(3)}ms (O(1) Pre-compiled rule map)`;
      }, 100);
    });
  </script>
</body>
</html>
