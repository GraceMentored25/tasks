<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;">
  <title>DocuMind AI - Document & PDF Q&A Assistant</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 2rem; }
    .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }
    .header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1rem; }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 0.5rem; }
    .badge { background: #0369a1; color: #e0f2fe; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; }
    .panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    h2 { font-size: 1.2rem; color: var(--accent); margin-bottom: 0.5rem; }
    textarea { width: 100%; height: 250px; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; padding: 1rem; font-size: 0.95rem; resize: vertical; }
    textarea:focus { outline: None; border-color: var(--accent); }
    .btn-group { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    button { background: var(--accent); color: #0f172a; border: none; padding: 0.65rem 1.25rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s ease; }
    button:hover { background: var(--accent-hover); color: white; }
    button.secondary { background: #334155; color: var(--text-main); }
    button.secondary:hover { background: #475569; }
    .qa-input-container { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .qa-input-container input { flex: 1; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; padding: 0.65rem; color: var(--text-main); }
    .output-box { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; min-height: 200px; max-height: 400px; overflow-y: auto; font-size: 0.95rem; line-height: 1.6; }
    .stat-bar { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 0.5rem; }
    .highlight { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">⚡ DocuMind AI</div>
      <div><span class="badge">Malt Freelance MVP (550€ - 750€/j)</span></div>
    </header>

    <!-- Left Column: Input & Controls -->
    <div class="panel">
      <h2>📄 Document Source Text</h2>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <label for="sample-select" style="font-size:0.85rem; color: var(--text-muted);">Preset Template:</label>
        <select id="sample-select" style="background: #0f172a; color: var(--text-main); border: 1px solid var(--border-color); padding: 0.4rem; border-radius: 4px;">
          <option value="legal">SaaS Service Level Agreement (SLA)</option>
          <option value="audit">Financial Audit & Performance Report</option>
          <option value="tech">Cloud Infrastructure Architecture Spec</option>
        </select>
      </div>
      <textarea id="doc-text" placeholder="Paste document content or edit loaded sample..."></textarea>

      <div class="btn-group">
        <button id="btn-summary">⚡ Executive Summary</button>
        <button id="btn-risks" class="secondary">⚠️ Key Risks & Compliance</button>
      </div>

      <h2>💬 Interactive Q&A Assistant</h2>
      <div class="qa-input-container">
        <input type="text" id="qa-query" placeholder="Ask a question about this document (e.g. What are the termination terms?)" />
        <button id="btn-ask">Ask AI</button>
      </div>
    </div>

    <!-- Right Column: AI Output & Insights -->
    <div class="panel">
      <h2>🤖 AI Analysis & Output</h2>
      <div id="output-box" class="output-box">
        <p style="color: var(--text-muted);">Select an action or ask a question to generate immediate AI analysis...</p>
      </div>
      <div class="stat-bar">
        <span id="perf-stat">Latency: 0ms (In-Memory Cache)</span>
        <span id="word-stat">Words: 0</span>
      </div>
    </div>
  </div>

  <script>
    // Sample documents database
    const SAMPLES = {
      legal: `MASTER SERVICES AGREEMENT & SLA
1. Termination & Liabilities: Either party may terminate this agreement with 30 days written notice. Liability is strictly capped at $500,000 or total fees paid in the trailing 12 months.
2. Data Privacy & GDPR: The provider agrees to process personal data in full compliance with GDPR guidelines. All customer data must be encrypted at rest (AES-256) and in transit (TLS 1.3).
3. Availability & Uptime: The target system availability is 99.95% monthly uptime. Exclusions include scheduled maintenance announced 72 hours in advance.
4. Indemnification: Provider agrees to defend Customer against IP infringement claims arising from core service modules.`,

      audit: `Q3 FINANCIAL AUDIT SUMMARY & REVENUE REPORT
1. Revenue Trends: Consolidated net revenue increased by 18.4% YoY to $4.2M, driven primarily by enterprise SaaS subscriptions.
2. Operational Expenses: R&D expenses rose by 12% due to expansion of AI engineering team. Customer acquisition cost (CAC) dropped from $450 to $380.
3. Balance Sheet Integrity: Cash flow from operations remains positive at $1.1M. No significant outstanding debts or unhedged currency exposures were identified.
4. Audit Opinion: Unqualified audit opinion issued. Risk factor identified in delayed collection cycles from EMEA enterprise accounts.`,

      tech: `CLOUD ARCHITECTURE & MICROSERVICES SPECIFICATION
1. Infrastructure: Deployed across AWS us-east-1 and eu-west-1 multi-AZ Kubernetes clusters. Auto-scaling handles traffic bursts up to 50,000 req/sec.
2. Security & Token Auth: JWT with short-lived 15-minute expiration backed by Redis session revoked store. Role-based access control (RBAC) enforced on API Gateway level.
3. Database & Caching: PostgreSQL 15 primary database with read-replicas. Redis cache layer yields sub-5ms lookup for 92% of payload requests.
4. DR & Recovery: RPO (Recovery Point Objective) is < 1 minute; RTO (Recovery Time Objective) is < 15 minutes with automated failover.`
    };

    const docText = document.getElementById('doc-text');
    const sampleSelect = document.getElementById('sample-select');
    const outputBox = document.getElementById('output-box');
    const perfStat = document.getElementById('perf-stat');
    const wordStat = document.getElementById('word-stat');

    // Load initial sample
    docText.value = SAMPLES.legal;
    updateWordCount();

    sampleSelect.addEventListener('change', () => {
      docText.value = SAMPLES[sampleSelect.value] || '';
      updateWordCount();
      clearIndexCache();
    });

    docText.addEventListener('input', () => {
      updateWordCount();
      clearIndexCache();
    });

    function updateWordCount() {
      const words = docText.value.trim().split(/\s+/).filter(Boolean).length;
      wordStat.textContent = `Words: ${words}`;
    }

    // --- BOLT PERFORMANCE OPTIMIZATION: Memoized In-Memory Index & Result Cache ---
    let cachedDocText = '';
    let parsedParagraphs = [];
    let indexedTokensMap = new Map();
    const qaResponseCache = new Map();

    function clearIndexCache() {
      cachedDocText = '';
      parsedParagraphs = [];
      indexedTokensMap.clear();
      qaResponseCache.clear();
    }

    function buildDocIndex() {
      if (cachedDocText === docText.value) return; // Skip rebuild if unchanged
      const t0 = performance.now();

      cachedDocText = docText.value;
      parsedParagraphs = cachedDocText.split('\n').filter(p => p.trim().length > 0);
      indexedTokensMap.clear();

      parsedParagraphs.forEach((para, idx) => {
        const tokens = para.toLowerCase().match(/\b\w+\b/g) || [];
        tokens.forEach(token => {
          if (!indexedTokensMap.has(token)) {
            indexedTokensMap.set(token, new Set());
          }
          indexedTokensMap.get(token).add(idx);
        });
      });

      const t1 = performance.now();
      console.log(`⚡ DocIndex rebuilt in ${(t1 - t0).toFixed(2)}ms`);
    }

    // Button: Executive Summary
    document.getElementById('btn-summary').addEventListener('click', () => {
      const t0 = performance.now();
      buildDocIndex();

      let html = `<h3>📊 Executive Summary</h3><ul style="margin-top:0.5rem; padding-left:1.2rem;">`;
      parsedParagraphs.forEach(para => {
        html += `<li style="margin-bottom:0.5rem;">${escapeHtml(para)}</li>`;
      });
      html += `</ul>`;

      const t1 = performance.now();
      outputBox.innerHTML = html;
      perfStat.textContent = `Latency: ${(t1 - t0).toFixed(2)}ms (Indexed)`;
    });

    // Button: Key Risks
    document.getElementById('btn-risks').addEventListener('click', () => {
      const t0 = performance.now();
      buildDocIndex();

      const riskKeywords = ['termination', 'risk', 'liability', 'capped', 'expenses', 'debt', 'gdpr', 'failover', 'delay'];
      const matched = new Set();

      riskKeywords.forEach(kw => {
        if (indexedTokensMap.has(kw)) {
          indexedTokensMap.get(kw).forEach(idx => matched.add(idx));
        }
      });

      let html = `<h3>⚠️ Identified Key Risks & Critical Clauses</h3>`;
      if (matched.size === 0) {
        html += `<p style="margin-top:0.5rem;">No standard risk keywords detected in this document text.</p>`;
      } else {
        html += `<ul style="margin-top:0.5rem; padding-left:1.2rem;">`;
        matched.forEach(idx => {
          html += `<li style="margin-bottom:0.5rem; color:#fca5a5;">${escapeHtml(parsedParagraphs[idx])}</li>`;
        });
        html += `</ul>`;
      }

      const t1 = performance.now();
      outputBox.innerHTML = html;
      perfStat.textContent = `Latency: ${(t1 - t0).toFixed(2)}ms (Indexed Search)`;
    });

    // Q&A Query Search
    document.getElementById('btn-ask').addEventListener('click', handleQA);
    document.getElementById('qa-query').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') handleQA();
    });

    function handleQA() {
      const query = document.getElementById('qa-query').value.trim();
      if (!query) return;

      const cacheKey = `${docText.value.length}:${query.toLowerCase()}`;
      if (qaResponseCache.has(cacheKey)) {
        const hit = qaResponseCache.get(cacheKey);
        outputBox.innerHTML = hit.html;
        perfStat.textContent = `Latency: ${hit.time.toFixed(2)}ms (⚡ Cache Hit)`;
        return;
      }

      const t0 = performance.now();
      buildDocIndex();

      const queryTokens = query.toLowerCase().match(/\b\w+\b/g) || [];
      const scoreMap = new Map();

      queryTokens.forEach(token => {
        if (indexedTokensMap.has(token)) {
          indexedTokensMap.get(token).forEach(paraIdx => {
            scoreMap.set(paraIdx, (scoreMap.get(paraIdx) || 0) + 1);
          });
        }
      });

      let sorted = Array.from(scoreMap.entries()).sort((a, b) => b[1] - a[1]);

      let html = `<h3>💡 Question: "${escapeHtml(query)}"</h3>`;
      if (sorted.length === 0) {
        html += `<p style="margin-top:0.5rem; color: var(--text-muted);">No direct relevant section found in the document. Try rephrasing your search keywords.</p>`;
      } else {
        html += `<div style="margin-top:0.75rem;"><strong style="color:var(--accent);">Most Relevant Relevant Excerpt:</strong></div>`;
        sorted.slice(0, 3).forEach(([idx, score]) => {
          html += `<div style="background:#1e293b; padding:0.75rem; border-radius:6px; margin-top:0.5rem; border-left:3px solid var(--accent);">
            ${escapeHtml(parsedParagraphs[idx])}
          </div>`;
        });
      }

      const t1 = performance.now();
      const elapsed = (t1 - t0);
      qaResponseCache.set(cacheKey, { html, time: elapsed });

      outputBox.innerHTML = html;
      perfStat.textContent = `Latency: ${elapsed.toFixed(2)}ms (Indexed)`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
