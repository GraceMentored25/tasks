<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>AI Copywriting Assistant | Fast SEO & Product Copy</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.5; }
    header { max-width: 1000px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; color: var(--accent); }
    .badge { background: #0369a1; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
    .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px; background: #090d16; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 0.95rem; }
    textarea { height: 100px; resize: vertical; }
    button { background: var(--accent); color: #0f172a; border: none; font-weight: 600; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); color: #fff; }
    .stats { display: flex; gap: 15px; margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); }
    .output-box { min-height: 200px; background: #090d16; border: 1px solid var(--border); border-radius: 6px; padding: 15px; font-size: 0.95rem; white-space: pre-wrap; overflow-y: auto; max-height: 350px; }
    .perf-tag { margin-top: 10px; font-size: 0.75rem; color: #34d399; text-align: right; }
    .history-item { padding: 8px; border-bottom: 1px solid var(--border); font-size: 0.85rem; cursor: pointer; color: var(--text-muted); }
    .history-item:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>⚡ AI Copywriting Assistant</h1>
    <span class="badge">Malt Ref #MALT-AI-2024-081</span>
  </header>

  <div class="container">
    <div class="card">
      <h2>Generator Settings</h2>
      <div class="form-group" style="margin-top: 15px;">
        <label for="product-name">Product / Topic Name</label>
        <input type="text" id="product-name" placeholder="e.g. Ergonomic Mechanical Keyboard" value="Wireless ANC Headphones">
      </div>
      <div class="form-group">
        <label for="template-type">ContentType</label>
        <select id="template-type">
          <option value="ecommerce">E-Commerce Product Description</option>
          <option value="seo">SEO Meta Description & Keywords</option>
          <option value="social">Social Media Ad Copy</option>
        </select>
      </div>
      <div class="form-group">
        <label for="tone">Tone of Voice</label>
        <select id="tone">
          <option value="persuasive">Persuasive & Energetic</option>
          <option value="professional">Professional & Direct</option>
          <option value="casual">Friendly & Casual</option>
        </select>
      </div>
      <div class="form-group">
        <label for="keywords">Key Features / Keywords</label>
        <textarea id="keywords" placeholder="Active Noise Canceling, 40h battery, USB-C fast charge">Active Noise Canceling, 40h battery, Ultra light, Bluetooth 5.3</textarea>
      </div>
      <button id="generate-btn">⚡ Generate Copy (Instant Cached)</button>
      <div class="stats">
        <span>Chars: <strong id="char-count">0</strong></span>
        <span>Est. Tokens: <strong id="token-count">0</strong></span>
        <span>Render Time: <strong id="render-time">0 ms</strong></span>
      </div>
    </div>

    <div class="card">
      <h2>Generated Output</h2>
      <div id="output" class="output-box" style="margin-top: 15px;">Click "Generate Copy" to create content...</div>
      <div id="perf-metrics" class="perf-tag">⚡ Bolt Optimized Cache: Ready</div>

      <h3 style="margin-top: 20px; font-size: 1rem;">Recent History (Cached)</h3>
      <div id="history-list" style="margin-top: 10px;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
