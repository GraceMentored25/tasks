<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
  <title>AI Copywriting & SEO Assistant | MVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-header">
    <div>
      <a href="../../index.html" class="back-link">&larr; Back to Hub</a>
      <h1>AI Copywriting & SEO Assistant</h1>
    </div>
    <div class="perf-badge">⚡ Stream Engine: <span id="generation-speed">Instant</span></div>
  </div>

  <div class="container">
    <!-- Prompt & Settings Panel -->
    <section class="card">
      <h2>1. Content Brief & Parameters</h2>
      <div class="form-group">
        <label for="topic-input">Target Topic / Keywords</label>
        <input type="text" id="topic-input" placeholder="e.g. Next-gen AI Tools for Freelancers, Remote Work Tips">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="channel-select">Output Channel</label>
          <select id="channel-select">
            <option value="blog">Blog Article & SEO Outline</option>
            <option value="linkedin">LinkedIn Professional Post</option>
            <option value="ad">High-Converting Ad Copy</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tone-select">Tone of Voice</label>
          <select id="tone-select">
            <option value="professional">Professional & Authoritative</option>
            <option value="engaging">Engaging & Conversational</option>
            <option value="urgent">Urgent & Direct CTA</option>
          </select>
        </div>
      </div>
      <div class="meta-row">
        <span class="meta-item">Estimated Tokens: <strong id="token-count">0</strong></span>
        <span class="meta-item">Estimated Words: <strong id="word-count">0</strong></span>
      </div>
      <button id="btn-generate" class="btn btn-primary">⚡ Generate Content Stream</button>
    </section>

    <!-- Generated Output Panel -->
    <section class="card">
      <div class="header-split">
        <h2>2. Generated AI Output</h2>
        <button id="btn-copy" class="btn btn-secondary">Copy Text</button>
      </div>
      <div id="output-box" class="output-box">
        <p class="placeholder-text">Enter a topic and click "Generate Content Stream" to view generated marketing copy.</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
