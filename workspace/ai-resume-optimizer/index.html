<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimiseur de CV IA - Commercial MVP</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #151c2c;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    header {
      border-bottom: 1px solid #2a364f;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .badge {
      background: #059669;
      color: #fff;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #0d1322;
      border: 1px solid #2a364f;
      color: white;
      border-radius: 8px;
      padding: 12px;
      font-family: inherit;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      margin-top: 16px;
      width: 100%;
    }
    button:hover {
      background: #059669;
    }
    #results-card {
      margin-top: 20px;
      padding: 16px;
      background: #0d1322;
      border-radius: 8px;
      border: 1px solid #2a364f;
      display: none;
    }
    .score-badge {
      font-size: 24px;
      font-weight: bold;
      color: #34d399;
    }
    .tag {
      display: inline-block;
      background: #1e293b;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin: 4px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">MVP Malt Ref: 1,500€ - 4,000€</span>
      <h2>⚡ Optimiseur de CV IA & Score ATS</h2>
      <p style="color: var(--muted); font-size: 14px;">Analyse ultra-rapide de compatibilité CV / Offre d'emploi sans latence UI.</p>
    </header>

    <div class="grid">
      <div>
        <label><strong>Votre CV (Texte brut)</strong></label>
        <textarea id="cv-text" placeholder="Collez le texte de votre CV ici... (ex: Développeur JavaScript React Node.js Git API...)"></textarea>
      </div>
      <div>
        <label><strong>Fiche de poste Cible</strong></label>
        <textarea id="job-text" placeholder="Collez le texte de l'offre d'emploi ici... (ex: Recherche Développeur Fullstack React Node.js Docker AWS TypeScript...)"></textarea>
      </div>
    </div>

    <button id="analyze-btn">⚡ Analyser la Compatibilité ATS</button>

    <div id="results-card">
      <h3>Résultat de l'analyse</h3>
      <p>Score de compatibilité : <span id="score" class="score-badge">0%</span></p>
      <p><strong>Mots-clés trouvés :</strong> <span id="found-tags"></span></p>
      <p><strong>Mots-clés manquants suggérés :</strong> <span id="missing-tags"></span></p>
      <p id="perf-metrics" style="font-size: 12px; color: var(--muted); margin-top: 10px;"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
