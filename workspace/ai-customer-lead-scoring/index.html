<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Customer Lead Scoring System - MVP</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 2rem; font-weight: 700; }
    p.subtitle { color: var(--muted); margin-top: 0.25rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: var(--text);
    }
    input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.625rem 0.875rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    button.btn-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.btn-primary:hover { opacity: 0.9; }
    .score-container {
      text-align: center;
      padding: 1.5rem;
      background: #0f172a;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .score-number {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
    }
    .status-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 0.25rem;
      font-weight: 700;
      font-size: 0.875rem;
      text-transform: uppercase;
    }
    .status-hot { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    .status-warm { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .status-cold { background: rgba(148, 163, 184, 0.2); color: var(--muted); border: 1px solid var(--muted); }

    .insights-list {
      list-style: none;
      font-size: 0.9rem;
    }
    .insights-list li {
      padding: 0.5rem 0;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .insights-list li:last-child { border-bottom: none; }
    .perf-meta {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">Commercial AI MVP</span>
      <h1>AI Customer Lead Scoring & Triage</h1>
      <p class="subtitle">Real-time predictive lead scoring with pre-compiled evaluation vectors & memoized scoring.</p>
    </header>

    <div class="grid">
      <!-- Input Form -->
      <div class="card">
        <h2 class="card-title">Lead Parameters</h2>
        <div class="form-group">
          <label for="companySize">Company Size (Employees)</label>
          <select id="companySize">
            <option value="enterprise">500+ (Enterprise)</option>
            <option value="mid" selected>50 - 499 (Mid-Market)</option>
            <option value="startup">1 - 49 (SMB / Startup)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="budget">Annual Budget Range</label>
          <select id="budget">
            <option value="high" selected>> $50,000</option>
            <option value="medium">$10,000 - $50,000</option>
            <option value="low">< $10,000</option>
          </select>
        </div>
        <div class="form-group">
          <label for="urgency">Implementation Urgency</label>
          <select id="urgency">
            <option value="immediate" selected>Immediate (< 1 month)</option>
            <option value="quarter">Current Quarter (1 - 3 months)</option>
            <option value="exploring">Exploring / No Timeline</option>
          </select>
        </div>
        <div class="form-group">
          <label for="engagement">Product Activity / Trial Engagement (0-100)</label>
          <input type="number" id="engagement" value="85" min="0" max="100">
        </div>
        <button id="scoreBtn" class="btn-primary">Calculate Lead Score ⚡</button>
      </div>

      <!-- Output Dashboard -->
      <div class="card">
        <h2 class="card-title">Lead Evaluation Results</h2>
        <div class="score-container">
          <div id="scoreDisplay" class="score-number" style="color: var(--success);">88</div>
          <div id="statusBadge" class="status-badge status-hot">🔥 Hot Prospect</div>
        </div>

        <h3 style="font-size: 1rem; margin-bottom: 0.5rem;">AI Conversion Factors</h3>
        <ul id="factorsList" class="insights-list">
          <!-- Populated by JS -->
        </ul>

        <div id="perfMeta" class="perf-meta">Evaluation computed in 0.00ms</div>
      </div>
    </div>
  </div>

  <script>
    /**
     * Bolt's Performance Optimizations:
     * 1. Pre-compiled Rules Table: Matrix lookups for evaluation scores in O(1) time.
     * 2. Memoized Score Function: Results cached by parameter hash.
     */
    const scoreCache = new Map();

    const rules = {
      companySize: { enterprise: 30, mid: 20, startup: 10 },
      budget: { high: 35, medium: 20, low: 5 },
      urgency: { immediate: 25, quarter: 15, exploring: 5 }
    };

    const companySize = document.getElementById('companySize');
    const budget = document.getElementById('budget');
    const urgency = document.getElementById('urgency');
    const engagement = document.getElementById('engagement');
    const scoreBtn = document.getElementById('scoreBtn');

    const scoreDisplay = document.getElementById('scoreDisplay');
    const statusBadge = document.getElementById('statusBadge');
    const factorsList = document.getElementById('factorsList');
    const perfMeta = document.getElementById('perfMeta');

    function calculateScore() {
      const startTime = performance.now();
      const sizeVal = companySize.value;
      const budgetVal = budget.value;
      const urgencyVal = urgency.value;
      const engVal = Math.min(100, Math.max(0, parseInt(engagement.value, 10) || 0));

      const cacheKey = `${sizeVal}:${budgetVal}:${urgencyVal}:${engVal}`;

      let result;
      let fromCache = false;

      if (scoreCache.has(cacheKey)) {
        result = scoreCache.get(cacheKey);
        fromCache = true;
      } else {
        const baseScore = rules.companySize[sizeVal] + rules.budget[budgetVal] + rules.urgency[urgencyVal];
        const engagementWeight = Math.round((engVal / 100) * 10);
        const finalScore = Math.min(100, baseScore + engagementWeight);

        const factors = [];
        if (sizeVal === 'enterprise') factors.push('✅ Enterprise tier target client (+30 pts)');
        if (budgetVal === 'high') factors.push('✅ High budget fit > $50k (+35 pts)');
        if (urgencyVal === 'immediate') factors.push('✅ Immediate deployment timeline (+25 pts)');
        if (engVal >= 70) factors.push(`✅ Active trial engagement (${engVal}/100)`);
        if (budgetVal === 'low') factors.push('⚠️ Budget constraint < $10k');
        if (urgencyVal === 'exploring') factors.push('⚠️ Uncommitted timeline');

        result = { score: finalScore, factors };
        scoreCache.set(cacheKey, result);
      }

      const duration = performance.now() - startTime;

      // Update UI
      scoreDisplay.textContent = result.score;
      if (result.score >= 75) {
        scoreDisplay.style.color = 'var(--danger)';
        statusBadge.className = 'status-badge status-hot';
        statusBadge.textContent = '🔥 Hot Prospect - Assign Senior AE';
      } else if (result.score >= 50) {
        scoreDisplay.style.color = 'var(--warning)';
        statusBadge.className = 'status-badge status-warm';
        statusBadge.textContent = '⚡ Warm Lead - Enroll in Nurture Campaign';
      } else {
        scoreDisplay.style.color = 'var(--muted)';
        statusBadge.className = 'status-badge status-cold';
        statusBadge.textContent = '❄️ Cold Lead - Automated Follow-up';
      }

      factorsList.innerHTML = result.factors.map(f => `<li>${f}</li>`).join('');
      perfMeta.textContent = `Evaluation computed in ${duration.toFixed(2)}ms ${fromCache ? '(Memoized)' : ''}`;
    }

    scoreBtn.addEventListener('click', calculateScore);
    calculateScore();
  </script>
</body>
</html>
