<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>AI Support Ticket Classifier | Fast Triage & Routing</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #151c2c;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --border: #1e293b;
      --high-priority: #ef4444;
      --med-priority: #f59e0b;
      --low-priority: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    header { max-width: 1100px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; color: var(--primary); }
    .badge { background: #3730a3; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
    .layout { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
    @media (max-width: 850px) { .layout { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px 12px; background: #0b1120; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 0.9rem; }
    textarea { height: 80px; }
    button { background: var(--primary); color: #fff; border: none; font-weight: 600; padding: 10px 16px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--primary-hover); }
    .ticket-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; max-height: 500px; overflow-y: auto; }
    .ticket-item { background: #0b1120; border: 1px solid var(--border); padding: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
    .ticket-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .priority-pill { font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .p-High { background: rgba(239, 68, 68, 0.2); color: var(--high-priority); border: 1px solid var(--high-priority); }
    .p-Medium { background: rgba(245, 158, 11, 0.2); color: var(--med-priority); border: 1px solid var(--med-priority); }
    .p-Low { background: rgba(16, 185, 129, 0.2); color: var(--low-priority); border: 1px solid var(--low-priority); }
    .filters { display: flex; gap: 10px; margin-bottom: 15px; }
    .filters select, .filters input { width: auto; flex: 1; }
    .metrics { font-size: 0.8rem; color: #34d399; margin-top: 10px; text-align: right; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ AI Support Ticket Classifier</h1>
    <span class="badge">Malt Ref #MALT-AI-2024-112</span>
  </header>

  <div class="layout">
    <div class="card">
      <h2>Submit New Ticket</h2>
      <div class="form-group" style="margin-top: 15px;">
        <label for="customer-email">Customer Email</label>
        <input type="email" id="customer-email" value="alex@company.com">
      </div>
      <div class="form-group">
        <label for="ticket-subject">Subject</label>
        <input type="text" id="ticket-subject" value="Billing issue: Double charge on invoice #4021">
      </div>
      <div class="form-group">
        <label for="ticket-message">Message</label>
        <textarea id="ticket-message">I noticed two charges of $49 on my credit card this morning for subscription renewal. Please refund the duplicate transaction immediately!</textarea>
      </div>
      <button id="add-ticket-btn" style="width: 100%;">⚡ Classify & Route Ticket</button>
      <button id="seed-tickets-btn" style="width: 100%; margin-top: 8px; background: #334155;">Load Sample Batch (10 Tickets)</button>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2>Tickets Queue (<span id="total-tickets">0</span>)</h2>
        <div class="metrics" id="perf-indicator">Render Time: 0 ms</div>
      </div>

      <div class="filters">
        <select id="filter-priority">
          <option value="ALL">All Priorities</option>
          <option value="High">High Priority</option>
          <option value="Medium">Medium Priority</option>
          <option value="Low">Low Priority</option>
        </select>
        <select id="filter-category">
          <option value="ALL">All Departments</option>
          <option value="Billing & Finance">Billing & Finance</option>
          <option value="Technical Support">Technical Support</option>
          <option value="Account Access">Account Access</option>
          <option value="General Inquiry">General Inquiry</option>
        </select>
      </div>

      <div id="tickets-container" class="ticket-list">
        <!-- Tickets dynamically rendered -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
