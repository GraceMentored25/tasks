<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI SEO & Content Generator</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131c2e;
      --border: #23314d;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .header { max-width: 1100px; margin: 0 auto 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.5rem; color: var(--primary); }
    .badge { background: #0284c7; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
    .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .panel h2 { font-size: 1.1rem; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    input, select { background: #05080e; border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 10px; font-size: 0.9rem; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    .btn { background: var(--primary); color: #000; border: none; padding: 12px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); color: white; }
    .output-box { background: #05080e; border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-height: 240px; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; color: #e2e8f0; }
    .stats { display: flex; gap: 12px; font-size: 0.85rem; }
    .stat-card { background: #05080e; border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; flex: 1; text-align: center; }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚀 AI SEO Content Generator</h1>
    <span class="badge">Commercial MVP (500€-700€/j)</span>
  </div>

  <div class="container">
    <div class="panel">
      <h2>1. Article & Keyword Settings</h2>

      <div class="form-group">
        <label for="topicInput">Target Topic / Title</label>
        <input id="topicInput" type="text" placeholder="e.g. Next.js 15 Server Actions and Performance Optimization" value="Next.js Performance Best Practices">
      </div>

      <div class="form-group">
        <label for="keywordsInput">Primary Keywords (comma separated)</label>
        <input id="keywordsInput" type="text" placeholder="e.g. React, Next.js, Web Vitals, SSR, Caching" value="Next.js, Web Vitals, Performance, Server Components">
      </div>

      <div class="form-group">
        <label for="formatSelect">Output Format</label>
        <select id="formatSelect">
          <option value="blog">Full SEO Blog Outline & Draft</option>
          <option value="meta">Meta Title & Description Tags</option>
          <option value="linkedin">LinkedIn Professional Post</option>
        </select>
      </div>

      <button id="generateBtn" class="btn">✨ Generate SEO Content</button>

      <div class="stats">
        <div class="stat-card">Word Count<div id="wordCount" class="stat-val">0</div></div>
        <div class="stat-card">KW Density<div id="kwDensity" class="stat-val">0%</div></div>
        <div class="stat-card">Gen Speed<div id="genSpeed" class="stat-val">0ms</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>2. AI Streamed Output</h2>
      <div id="outputBox" class="output-box">Click 'Generate SEO Content' to stream AI generated content...</div>
      <button id="copyBtn" class="btn" style="background:var(--border); color:var(--text); align-self:flex-end; display:none;">📋 Copy Content</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
