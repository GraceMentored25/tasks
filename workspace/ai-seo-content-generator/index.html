<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI SEO Content Generator & Keyword Optimizer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    h1 { margin: 0 0 0.5rem 0; color: var(--accent); }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      border: 1px solid var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1.5rem;
    }
    textarea {
      width: 100%;
      height: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--text);
      padding: 0.75rem;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
    }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .stats-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .stats-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }
    .perf-tag {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #4ade80;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ AI SEO Content Generator</h1>
      <span class="badge">Malt Ref: MALT-892401 | TJM: €640/day</span>
    </header>

    <div class="grid">
      <div class="card">
        <h2>Input Content</h2>
        <textarea id="inputText" placeholder="Paste your article draft here to analyze keywords and generate optimized SEO titles..."></textarea>
        <button id="generateBtn">Generate SEO Optimization</button>
      </div>

      <div class="card">
        <h2>Keyword Analysis</h2>
        <div id="stats">
          <p style="color: var(--muted)">Start typing or enter text to see instant keyword density analysis.</p>
        </div>
        <div id="seoMeta" style="margin-top: 1.5rem;"></div>
        <div id="perfMetrics" class="perf-tag"></div>
      </div>
    </div>
  </div>

  <script>
    // Performance optimization: Simple O(1) Cache map for expensive calculations
    const memoCache = new Map();
    const MAX_CACHE_SIZE = 50;

    function getKeywordsAndStats(text) {
      if (memoCache.has(text)) {
        return { data: memoCache.get(text), cached: true };
      }

      const words = text.toLowerCase().match(/\b[a-z0-9_]{3,}\b/g) || [];
      const frequencyMap = new Map();
      const stopWords = new Set(['the', 'and', 'for', 'that', 'this', 'with', 'you', 'are', 'from', 'have', 'your', 'with']);

      for (const word of words) {
        if (!stopWords.has(word)) {
          frequencyMap.set(word, (frequencyMap.get(word) || 0) + 1);
        }
      }

      const sorted = Array.from(frequencyMap.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      const result = {
        totalWords: words.length,
        topKeywords: sorted
      };

      if (memoCache.size >= MAX_CACHE_SIZE) {
        const firstKey = memoCache.keys().next().value;
        memoCache.delete(firstKey);
      }
      memoCache.set(text, result);

      return { data: result, cached: false };
    }

    const inputText = document.getElementById('inputText');
    const statsDiv = document.getElementById('stats');
    const seoMetaDiv = document.getElementById('seoMeta');
    const perfMetricsDiv = document.getElementById('perfMetrics');

    function updateAnalysis() {
      const startTime = performance.now();
      const text = inputText.value;
      if (!text.trim()) {
        statsDiv.innerHTML = '<p style="color: var(--muted)">Start typing or enter text to see instant keyword density analysis.</p>';
        seoMetaDiv.innerHTML = '';
        perfMetricsDiv.innerText = '';
        return;
      }

      const { data, cached } = getKeywordsAndStats(text);
      const executionTime = (performance.now() - startTime).toFixed(2);

      let html = `<ul class="stats-list"><li class="stats-item"><span>Total Key Words</span><strong>${data.totalWords}</strong></li>`;
      data.topKeywords.forEach(([word, count]) => {
        const density = ((count / (data.totalWords || 1)) * 100).toFixed(1);
        html += `<li class="stats-item"><span>${word}</span><strong>${count} (${density}%)</strong></li>`;
      });
      html += '</ul>';

      statsDiv.innerHTML = html;
      perfMetricsDiv.innerText = `⚡ Execution time: ${executionTime}ms ${cached ? '(Cached O(1) Lookup)' : '(Fresh Calculation)'}`;
    }

    // Debounce to optimize DOM update frequency on typing
    let debounceTimer;
    inputText.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updateAnalysis, 150);
    });

    document.getElementById('generateBtn').addEventListener('click', () => {
      const text = inputText.value;
      if (!text.trim()) return;
      const { data } = getKeywordsAndStats(text);
      const primaryKeywords = data.topKeywords.map(k => k[0]).join(', ');
      seoMetaDiv.innerHTML = `
        <h3 style="color: var(--accent); margin-bottom: 0.5rem;">Generated Meta Title</h3>
        <p style="background: var(--bg); padding: 0.5rem; border-radius: 4px; font-size: 0.9rem;">
          ${primaryKeywords ? 'Best ' + primaryKeywords + ' Guide & Strategies 2026' : 'Ultimate AI SEO Guide'}
        </p>
      `;
    });
  </script>
</body>
</html>
