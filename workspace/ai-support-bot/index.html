<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>Agent IA Support Client Multilingue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>⚡ Agent IA Support Client</h1>
      <span class="badge">Commercial MVP - Malt Ref: 500€-750€/j</span>
    </header>

    <main class="chat-layout">
      <aside class="sidebar">
        <h3>Options Support</h3>
        <label for="lang-select">Langue :</label>
        <select id="lang-select">
          <option value="fr">Français 🇫🇷</option>
          <option value="en">English 🇬🇧</option>
          <option value="es">Español 🇪🇸</option>
        </select>

        <div class="search-box">
          <label for="filter-input">Filtrer historique :</label>
          <input type="text" id="filter-input" placeholder="Recherche rapide...">
        </div>
      </aside>

      <section class="chat-panel">
        <div id="chat-history" class="chat-history"></div>
        <form id="chat-form" class="chat-form">
          <input type="text" id="user-input" placeholder="Posez votre question à l'IA..." required>
          <button type="submit" id="send-btn">Envoyer</button>
        </form>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
