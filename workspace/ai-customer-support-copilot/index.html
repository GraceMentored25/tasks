<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Customer Support Copilot ⚡</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="border-b border-slate-800 bg-slate-950/80 p-4 sticky top-0 backdrop-blur z-10">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🎧</span>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-300 bg-clip-text text-transparent">Support Copilot AI</h1>
          <p class="text-xs text-slate-400">Commercial MVP Reference: Malt (€1,500 - €3,500)</p>
        </div>
      </div>
      <a href="../../index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-slate-300 transition">← Back to Hub</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full flex-1 p-4 grid grid-cols-1 md:grid-cols-12 gap-6">
    <!-- Ticket List Column -->
    <section class="md:col-span-5 bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold text-slate-200">Incoming Tickets</h2>
        <span id="ticket-count" class="text-xs bg-blue-900/60 text-blue-300 px-2 py-0.5 rounded-full font-mono">0 tickets</span>
      </div>

      <div class="relative">
        <input id="search-input" type="text" placeholder="Filter tickets by keyword or tag..." aria-label="Filter tickets by keyword or tag" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500">
      </div>

      <div id="ticket-list" class="flex-1 overflow-y-auto space-y-3 max-h-[600px] pr-1">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- AI Copilot Workbench -->
    <section class="md:col-span-7 bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-4">
      <div id="active-ticket-header" class="border-b border-slate-800 pb-3">
        <h2 class="text-lg font-semibold text-slate-200" id="ticket-title">Select a ticket</h2>
        <p class="text-xs text-slate-400" id="ticket-meta">Click on any incoming ticket on the left to start AI draft generation.</p>
      </div>

      <div id="ticket-body-container" class="bg-slate-900/50 p-4 rounded-lg border border-slate-800 text-sm text-slate-300 min-h-[100px] hidden">
        <div id="ticket-customer-query" class="italic text-slate-400"></div>
      </div>

      <!-- AI Generated Draft Box -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <label for="ai-reply" class="text-xs font-semibold text-teal-400 flex items-center gap-1.5">
            <span>⚡ AI Copilot Suggested Response</span>
            <span id="perf-badge" class="hidden text-[10px] bg-teal-950 text-teal-300 border border-teal-800 px-1.5 py-0.5 rounded font-mono">Generated in &lt;1ms</span>
          </label>
          <button id="btn-re-generate" class="text-xs text-slate-400 hover:text-teal-300 transition hidden" aria-label="Regenerate reply">↻ Regenerate</button>
        </div>

        <textarea id="ai-reply" rows="8" aria-label="AI Copilot Suggested Response" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-teal-500 font-sans" placeholder="Select a ticket to generate instant AI response suggestions..."></textarea>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between items-center pt-2">
        <div id="quick-actions" class="flex gap-2">
          <!-- Quick action tags -->
        </div>
        <button id="btn-send" class="bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition focus:ring-2 focus:ring-teal-400">
          Send Response
        </button>
      </div>
    </section>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
