<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Repurposer ⚡</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="border-b border-slate-800 bg-slate-950/80 p-4 sticky top-0 backdrop-blur z-10">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-2xl">✨</span>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-300 bg-clip-text text-transparent">AI Content Repurposer</h1>
          <p class="text-xs text-slate-400">Commercial MVP Reference: Malt (€2,000 - €4,000)</p>
        </div>
      </div>
      <a href="../../index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-slate-300 transition">← Back to Hub</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full flex-1 p-4 grid grid-cols-1 md:grid-cols-12 gap-6">
    <!-- Input Source Column -->
    <section class="md:col-span-6 bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <label htmlFor="source-text" class="font-semibold text-slate-200">Source Content / Article / Transcript</label>
        <span id="source-char-count" class="text-xs text-slate-500 font-mono">0 chars</span>
      </div>

      <textarea id="source-text" rows="12" aria-label="Source Content / Article / Transcript" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500 font-sans leading-relaxed" placeholder="Paste your blog post, podcast notes, or video transcript here..."></textarea>

      <div class="flex flex-wrap items-center justify-between gap-2 pt-2">
        <div class="flex gap-2">
          <button id="btn-sample-1" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 px-2.5 py-1.5 rounded text-slate-300 transition">Sample Article</button>
          <button id="btn-clear" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 px-2.5 py-1.5 rounded text-slate-400 hover:text-slate-200 transition">Clear</button>
        </div>
        <button id="btn-transform" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition focus:ring-2 focus:ring-purple-400">
          ⚡ Transform All Formats
        </button>
      </div>
    </section>

    <!-- Target Output Formats -->
    <section class="md:col-span-6 bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div id="tab-group" class="flex gap-2">
          <button data-platform="linkedin" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-purple-950 text-purple-300 border border-purple-800">LinkedIn Post</button>
          <button data-platform="twitter" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 hover:text-slate-200">Twitter Thread</button>
          <button data-platform="newsletter" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 hover:text-slate-200">Newsletter Digest</button>
        </div>
        <span id="render-perf" class="text-[10px] bg-purple-950 text-purple-300 border border-purple-800 px-2 py-0.5 rounded font-mono hidden">Fast transformed</span>
      </div>

      <!-- Result Card -->
      <div class="flex-1 flex flex-col gap-2">
        <div class="flex justify-between items-center text-xs text-slate-400">
          <span id="active-platform-title">LinkedIn Post Format</span>
          <button id="btn-copy" class="hover:text-purple-300 transition flex items-center gap-1" aria-label="Copy output text">
            📋 Copy Output
          </button>
        </div>

        <div id="output-box" class="w-full flex-1 min-h-[300px] bg-slate-900 border border-slate-800 rounded-lg p-4 text-sm text-slate-200 whitespace-pre-wrap font-sans leading-relaxed overflow-y-auto">
          Paste content on the left and click "Transform All Formats" to view AI generated social media posts.
        </div>
      </div>
    </section>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
