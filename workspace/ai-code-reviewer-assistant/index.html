<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Code Reviewer & Security Audit Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <header class="border-b border-slate-800 bg-slate-950/80 px-6 py-4 sticky top-0 z-50 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">🛡️</span>
      <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-indigo-300 bg-clip-text text-transparent">AI Code Reviewer Assistant</h1>
      <span class="bg-purple-500/20 text-purple-300 text-xs px-2.5 py-1 rounded-full border border-purple-500/30">Malt MVP #MLT-93015</span>
    </div>
    <a href="../index.html" class="text-xs text-slate-400 hover:text-white transition">← Return to Portal</a>
  </header>

  <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- Code Editor Section -->
    <section class="lg:col-span-6 space-y-4">
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-5 shadow-lg space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-slate-200">Source Code Input</h2>
          <span id="cache-indicator" class="text-xs text-purple-400 font-mono">⚡ Token Cache Ready</span>
        </div>

        <div>
          <label for="code-input" class="sr-only">Source Code</label>
          <textarea id="code-input" rows="14" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono text-emerald-400 focus:outline-none focus:border-purple-500" placeholder="Paste your JavaScript / TypeScript / Python snippet here..."></textarea>
        </div>

        <div class="flex items-center gap-3">
          <button id="btn-review" class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium text-sm py-2 px-4 rounded-lg transition">
            ⚡ Run AI Security & Code Audit
          </button>
          <button id="btn-load-sample" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-2 px-3 rounded-lg transition">
            Load Flawed Sample
          </button>
        </div>
      </div>
    </section>

    <!-- Review Results & Security Analysis -->
    <section class="lg:col-span-6 space-y-4">
      <!-- Overview Score Cards -->
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 text-center">
          <div id="stat-issues" class="text-2xl font-bold text-red-400">0</div>
          <div class="text-xs text-slate-400">Security Risks</div>
        </div>
        <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 text-center">
          <div id="stat-complexity" class="text-2xl font-bold text-amber-400">Low</div>
          <div class="text-xs text-slate-400">Cyclomatic Comp.</div>
        </div>
        <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 text-center">
          <div id="stat-score" class="text-2xl font-bold text-emerald-400">100%</div>
          <div class="text-xs text-slate-400">Code Health</div>
        </div>
      </div>

      <!-- Vulnerability & Refactoring Findings -->
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-5 shadow-lg space-y-3">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Audit Diagnostic Findings</h3>
        <div id="findings-container" class="space-y-3 max-h-96 overflow-y-auto pr-1">
          <!-- Injected via DocumentFragment -->
        </div>
      </div>
    </section>
  </main>

  <script>
    // --- BOLT PERFORMANCE ENGINE ---
    // O(1) Tokenization & Audit Cache
    const auditCache = new Map();

    const codeInput = document.getElementById('code-input');
    const cacheIndicator = document.getElementById('cache-indicator');

    const sampleFlawedCode = `// Vulnerable Authentication Handler
async function loginUser(req, res) {
  const apiKey = "sk_live_99823a8b72c019d44f"; // Hardcoded secret!
  const userQuery = "SELECT * FROM users WHERE email = '" + req.body.email + "'"; // SQL Injection!

  try {
    const user = await db.query(userQuery);
    if (!user) {
      eval(req.body.customCallback); // Dangerous eval!
    }
    res.send({ user: user, debug: process.env }); // Leaking sensitive env!
  } catch(err) {
    console.log(err);
  }
}`;

    document.getElementById('btn-load-sample').addEventListener('click', () => {
      codeInput.value = sampleFlawedCode;
      runAudit();
    });

    document.getElementById('btn-review').addEventListener('click', () => {
      runAudit();
    });

    function analyzeCode(code) {
      if (!code || code.trim().length === 0) {
        return { issuesCount: 0, complexity: 'N/A', score: 100, findings: [] };
      }

      // O(1) Cache Lookup
      if (auditCache.has(code)) {
        cacheIndicator.textContent = '⚡ O(1) Cache Hit';
        return auditCache.get(code);
      }

      cacheIndicator.textContent = '⚡ Computing...';

      const findings = [];
      let issuesCount = 0;

      // Rule 1: Hardcoded Secrets
      if (/sk_live_[a-0-9]+/i.test(code) || /api[_-]?key\s*=\s*['"][a-zA-Z0-9_-]+/i.test(code)) {
        issuesCount++;
        findings.push({
          severity: 'CRITICAL',
          title: 'Hardcoded API Secret Detected',
          description: 'Found plaintext credentials or private API keys in source code. Move secrets to environment variables.',
          recommendation: 'const apiKey = process.env.API_KEY;'
        });
      }

      // Rule 2: SQL Injection
      if (/SELECT\s+.*WHERE\s+.*['"]\s*\+\s*/i.test(code) || /INSERT\s+INTO\s+.*VALUES\s*\(.*['"]\s*\+/i.test(code)) {
        issuesCount++;
        findings.push({
          severity: 'HIGH',
          title: 'Potential SQL Injection',
          description: 'Concatenating raw user input directly into SQL queries opens the application to database compromise.',
          recommendation: 'Use parameterized queries: db.query("SELECT * FROM users WHERE email = ?", [email]);'
        });
      }

      // Rule 3: Dangerous eval()
      if (/eval\s*\(/i.test(code)) {
        issuesCount++;
        findings.push({
          severity: 'CRITICAL',
          title: 'Dangerous eval() Execution',
          description: 'Evaluating arbitrary string expressions creates severe remote code execution (RCE) vulnerabilities.',
          recommendation: 'Avoid eval() entirely; parse JSON with JSON.parse() safely.'
        });
      }

      // Rule 4: Env Leakage
      if (/process\.env/i.test(code) && /res\.(send|json)/i.test(code)) {
        issuesCount++;
        findings.push({
          severity: 'MEDIUM',
          title: 'Potential Environment Info Leakage',
          description: 'Transmitting process.env in response objects can expose secret configuration parameters.',
          recommendation: 'Return only public, non-sensitive properties.'
        });
      }

      // Cyclomatic Complexity calculation based on control keywords
      const controlMatches = code.match(/\b(if|else|for|while|catch|switch|case|try)\b/g) || [];
      const complexity = controlMatches.length > 5 ? 'High' : (controlMatches.length > 2 ? 'Medium' : 'Low');

      const healthScore = Math.max(10, 100 - (issuesCount * 25));

      const result = {
        issuesCount,
        complexity,
        score: healthScore,
        findings
      };

      if (auditCache.size > 50) {
        const oldestKey = auditCache.keys().next().value;
        auditCache.delete(oldestKey);
      }
      auditCache.set(code, result);

      return result;
    }

    function runAudit() {
      const code = codeInput.value;
      const res = analyzeCode(code);

      document.getElementById('stat-issues').textContent = res.issuesCount;
      document.getElementById('stat-complexity').textContent = res.complexity;
      document.getElementById('stat-score').textContent = res.score + '%';

      const container = document.getElementById('findings-container');
      const fragment = document.createDocumentFragment();

      if (res.findings.length === 0) {
        const okBox = document.createElement('div');
        okBox.className = 'bg-emerald-900/30 border border-emerald-500/30 rounded-lg p-4 text-emerald-300 text-xs text-center';
        okBox.textContent = '✅ No critical security issues detected in this snippet!';
        fragment.appendChild(okBox);
      } else {
        res.findings.forEach(f => {
          const card = document.createElement('div');
          const badgeColor = f.severity === 'CRITICAL' ? 'bg-red-500/20 text-red-400 border-red-500/30' :
                            (f.severity === 'HIGH' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-blue-500/20 text-blue-400 border-blue-500/30');

          card.className = 'bg-slate-900/80 border border-slate-800 rounded-lg p-3.5 space-y-2 text-xs';
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-200">${f.title}</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-semibold border ${badgeColor}">${f.severity}</span>
            </div>
            <p class="text-slate-400">${f.description}</p>
            <div class="bg-slate-950 p-2 rounded border border-slate-800 font-mono text-emerald-400 text-[11px]">
              💡 Fix: ${f.recommendation}
            </div>
          `;
          fragment.appendChild(card);
        });
      }

      container.innerHTML = '';
      container.appendChild(fragment);
    }

    // Default sample on load
    codeInput.value = sampleFlawedCode;
    runAudit();
  </script>
</body>
</html>
