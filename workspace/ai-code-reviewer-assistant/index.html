<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Code Reviewer Assistant | Bolt ⚡ MVP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-6 py-8">
    <!-- Header -->
    <div class="flex items-center justify-between pb-6 mb-6 border-b border-slate-800">
      <div>
        <a href="../" class="text-xs text-violet-400 hover:text-violet-300 transition mb-1 inline-block">← Back to Workspace Hub</a>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <span>🛡️ AI Code Reviewer Assistant</span>
          <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-0.5 rounded-full">⚡ Bolt Optimized</span>
        </h1>
      </div>
      <div class="text-right text-xs text-slate-400">
        <div>Malt Ref: <span class="text-slate-200">#MALT-REV-AI-9234</span></div>
        <div>TJM: <span class="text-emerald-400 font-semibold">650€ - 850€</span></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="mb-6 flex flex-wrap gap-3 items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xs font-semibold text-slate-400">Preset Samples:</span>
        <button onclick="loadSample('vulnerable')" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-rose-300 transition">⚠️ Flawed JS Code</button>
        <button onclick="loadSample('optimized')" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-emerald-300 transition">⚡ Clean TS Code</button>
      </div>

      <div class="flex items-center gap-3">
        <select id="lang" class="bg-slate-900 border border-slate-800 text-xs text-slate-200 rounded-lg px-3 py-1.5">
          <option value="javascript">JavaScript / TypeScript</option>
          <option value="python">Python</option>
        </select>
        <button onclick="analyzeCode()" class="px-4 py-1.5 rounded-lg bg-violet-600 hover:bg-violet-500 text-white font-medium text-xs shadow-lg shadow-violet-600/20 transition">Run AI Security Audit ⚡</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Code Editor -->
      <div class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-xl p-5">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-semibold text-slate-400 uppercase">Input Source Code</span>
          <span id="lineCount" class="text-xs text-slate-500">12 lines</span>
        </div>
        <textarea id="codeEditor" rows="16" oninput="debouncedAnalyze()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-xs text-slate-200 leading-relaxed focus:border-violet-500 focus:outline-none" placeholder="Paste code snippet here..."></textarea>
      </div>

      <!-- Analysis Results -->
      <div class="lg:col-span-5 space-y-6">
        <!-- Health Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 grid grid-cols-2 gap-4 text-center">
          <div>
            <div class="text-xs text-slate-400">Code Quality Score</div>
            <div id="qualityScore" class="text-2xl font-extrabold text-amber-400">65 / 100</div>
          </div>
          <div>
            <div class="text-xs text-slate-400">Scan Latency</div>
            <div id="scanLatency" class="text-2xl font-extrabold text-emerald-400">1.20 ms</div>
          </div>
        </div>

        <!-- Issue Feed -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
          <h3 class="text-xs font-semibold uppercase text-slate-400 mb-3">Detected Audit Findings</h3>
          <div id="issueContainer" class="space-y-3 text-xs max-h-[320px] overflow-y-auto">
            <div class="text-slate-500">Running initial code scan...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚡ BOLT PERFORMANCE OPTIMIZATION: Memoized Regex Rules Engine Map
    const rulesIndex = [
      { id: 'eval', pattern: /\beval\s*\(/gi, severity: 'CRITICAL', type: 'Security', msg: 'Unsafe code execution via eval() detected.' },
      { id: 'secret', pattern: /(api[_-]?key|password|secret)\s*=\s*['"][a-zA-Z0-9_\-]{8,}['"]/gi, severity: 'HIGH', type: 'Security', msg: 'Hardcoded secret or API key credential exposed.' },
      { id: 'sql_concat', pattern: /query\s*\(\s*['"`].*?\$\{.*?\}/gi, severity: 'HIGH', type: 'Security', msg: 'SQL query string concatenation (SQL injection risk).' },
      { id: 'sync_fs', pattern: /fs\.readFileSync/gi, severity: 'MEDIUM', type: 'Performance', msg: 'Synchronous blocking I/O operation in main thread.' },
      { id: 'nested_loop', pattern: /for\s*\(.*?\)\s*\{\s*for\s*\(/gi, severity: 'MEDIUM', type: 'Performance', msg: 'Potential O(N²) nested loop iteration.' }
    ];

    const scanCache = new Map();

    function computeAuditMemoized(code) {
      if (scanCache.has(code)) {
        return scanCache.get(code);
      }

      const issues = [];
      for (let i = 0; i < rulesIndex.length; i++) {
        const rule = rulesIndex[i];
        if (rule.pattern.test(code)) {
          issues.push({ ...rule });
          rule.pattern.lastIndex = 0; // Reset stateful regex
        }
      }

      if (scanCache.size > 50) scanCache.clear();
      scanCache.set(code, issues);
      return issues;
    }

    let analyzeTimeout;
    function debouncedAnalyze() {
      clearTimeout(analyzeTimeout);
      analyzeTimeout = setTimeout(analyzeCode, 40);
    }

    function analyzeCode() {
      const startTime = performance.now();
      const code = document.getElementById('codeEditor').value;

      const lines = code.split('\n').length;
      document.getElementById('lineCount').innerText = `${lines} lines`;

      const issues = computeAuditMemoized(code);
      const container = document.getElementById('issueContainer');
      container.innerHTML = '';

      let penalty = 0;
      if (issues.length === 0) {
        container.innerHTML = `<div class="p-3 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-lg">✓ No security or performance issues detected in this snippet!</div>`;
      } else {
        issues.forEach(iss => {
          penalty += iss.severity === 'CRITICAL' ? 35 : iss.severity === 'HIGH' ? 20 : 10;
          const color = iss.severity === 'CRITICAL' ? 'rose' : iss.severity === 'HIGH' ? 'amber' : 'sky';
          const card = document.createElement('div');
          card.className = `p-3 bg-${color}-500/10 border border-${color}-500/20 rounded-lg text-slate-200`;
          card.innerHTML = `<div class="flex justify-between font-bold text-${color}-400 mb-1">
            <span>[${iss.type}] ${iss.msg}</span>
            <span>${iss.severity}</span>
          </div>
          <div class="text-[11px] text-slate-400">Recommendation: Use parameterized queries/environment variables.</div>`;
          container.appendChild(card);
        });
      }

      const finalScore = Math.max(0, 100 - penalty);
      document.getElementById('qualityScore').innerText = `${finalScore} / 100`;

      const duration = (performance.now() - startTime).toFixed(2);
      document.getElementById('scanLatency').innerText = `${duration} ms`;
    }

    function loadSample(type) {
      if (type === 'vulnerable') {
        document.getElementById('codeEditor').value = `// Insecure and slow legacy code snippet
const apiKey = "sk_live_99881122334455667788";
const fs = require('fs');

function fetchUserData(userId) {
  const data = fs.readFileSync('/var/data/users.json');
  const sql = \`SELECT * FROM users WHERE id = '\${userId}'\`;
  db.query(sql);
  eval("console.log('User synced: ' + userId)");
}

for(let i=0; i<items.length; i++) {
  for(let j=0; j<items.length; j++) {
    // nested iteration
  }
}`;
      } else {
        document.getElementById('codeEditor').value = `// Clean and optimized TypeScript snippet
import { env } from './config';

export async function fetchUserData(userId: string): Promise<User> {
  const apiKey = env.API_KEY;
  const user = await db.query('SELECT * FROM users WHERE id = $1', [userId]);
  return user;
}`;
      }
      analyzeCode();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSample('vulnerable');
    });
  </script>
</body>
</html>
