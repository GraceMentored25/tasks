<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Resume & Job Matcher (ATS Scoring)</title>
  <style>
    :root {
      --bg: #0c0a09;
      --card: #1c1917;
      --accent: #f97316;
      --text: #fafaf9;
      --muted: #a8a29e;
      --border: #292524;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    h1 { margin: 0 0 0.5rem 0; color: var(--accent); }
    .badge {
      display: inline-block;
      background: rgba(249, 115, 22, 0.1);
      color: var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      border: 1px solid var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1.5rem;
    }
    textarea {
      width: 100%;
      height: 150px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--text);
      padding: 0.75rem;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
    }
    .score-circle {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      margin: 0.5rem 0;
    }
    .missing-tag {
      display: inline-block;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      margin: 0.2rem;
    }
    .perf-tag {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #fb923c;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎯 AI Resume & Job Matcher</h1>
      <span class="badge">Malt Ref: MALT-732910 | TJM: €800/day</span>
    </header>

    <div class="grid">
      <div class="card">
        <h3>Resume Content</h3>
        <textarea id="resumeInput" placeholder="Paste candidate resume text here (e.g. JavaScript, React, Node.js, TypeScript, SQL)..."></textarea>

        <h3 style="margin-top: 1rem;">Job Description Requirements</h3>
        <textarea id="jobInput" placeholder="Paste job requirements here (e.g. Looking for React developer with TypeScript, GraphQL and Docker)..."></textarea>
      </div>

      <div class="card">
        <h2>ATS Compatibility Score</h2>
        <div id="results">
          <p style="color: var(--muted)">Fill in both fields to calculate ATS score & missing keywords.</p>
        </div>
        <div id="perfMetrics" class="perf-tag"></div>
      </div>
    </div>
  </div>

  <script>
    function extractKeywords(text) {
      const words = text.toLowerCase().match(/\b[a-z0-9_+#.]{2,}\b/g) || [];
      const stopWords = new Set(['and', 'the', 'for', 'with', 'a', 'an', 'in', 'of', 'to', 'is', 'are', 'required', 'looking', 'developer']);
      return new Set(words.filter(w => !stopWords.has(w)));
    }

    function calculateATSScore(resumeText, jobText) {
      const resumeSet = extractKeywords(resumeText);
      const jobSet = extractKeywords(jobText);

      if (jobSet.size === 0) return { score: 0, missing: [] };

      let matchCount = 0;
      const missing = [];

      for (const kw of jobSet) {
        if (resumeSet.has(kw)) {
          matchCount++;
        } else {
          missing.push(kw);
        }
      }

      const score = Math.round((matchCount / jobSet.size) * 100);
      return { score, missing: missing.slice(0, 8) };
    }

    const resumeInput = document.getElementById('resumeInput');
    const jobInput = document.getElementById('jobInput');
    const resultsDiv = document.getElementById('results');
    const perfMetricsDiv = document.getElementById('perfMetrics');

    function updateMatch() {
      const rText = resumeInput.value.trim();
      const jText = jobInput.value.trim();

      if (!rText || !jText) {
        resultsDiv.innerHTML = '<p style="color: var(--muted)">Fill in both fields to calculate ATS score & missing keywords.</p>';
        perfMetricsDiv.innerText = '';
        return;
      }

      const t0 = performance.now();
      const { score, missing } = calculateATSScore(rText, jText);
      const t1 = performance.now();

      let missingHtml = missing.map(m => `<span class="missing-tag">${m}</span>`).join(' ');

      resultsDiv.innerHTML = `
        <div class="score-circle">${score}%</div>
        <p><strong>Missing Key Qualifications:</strong></p>
        <div>${missingHtml || '<span style="color:#4ade80">All key skills matched!</span>'}</div>
      `;

      perfMetricsDiv.innerText = `⚡ ATS Calculation time: ${(t1 - t0).toFixed(3)}ms (Set intersection O(N))`;
    }

    let debounce;
    const triggerUpdate = () => {
      clearTimeout(debounce);
      debounce = setTimeout(updateMatch, 150);
    };

    resumeInput.addEventListener('input', triggerUpdate);
    jobInput.addEventListener('input', triggerUpdate);
  </script>
</body>
</html>
