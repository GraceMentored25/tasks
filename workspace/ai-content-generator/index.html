<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de Contenu IA - Commercial MVP</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #161e2e;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    header {
      border-bottom: 1px solid #2d3748;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .badge {
      background: #7c3aed;
      color: #fff;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    select, input {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #2d3748;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      font-size: 15px;
    }
    button:hover {
      background: #7c3aed;
    }
    #output-box {
      margin-top: 20px;
      background: #0f172a;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 16px;
      min-height: 150px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .metrics {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">MVP Malt Ref: 2,500€ - 6,000€</span>
      <h2>⚡ Générateur de Contenu Marketing IA</h2>
      <p style="color: var(--muted); font-size: 14px;">Génération fluide en temps réel (Simulation de streaming IA 60 FPS).</p>
    </header>

    <div class="form-group">
      <label for="content-type">Type de contenu</label>
      <select id="content-type">
        <option value="linkedin">Post LinkedIn Virale</option>
        <option value="email">Email de Prospection / Newsletter</option>
        <option value="ad">Accroche Publicitaire (SaaS/E-commerce)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="topic">Sujet principal / Produit</label>
      <input type="text" id="topic" placeholder="ex: Lancement d'une nouvelle application de productivité pour freelances" value="Lancement d'une application IA pour automatiser le support client">
    </div>

    <button id="generate-btn">⚡ Générer le Contenu</button>

    <div id="output-box">Le contenu généré s'affichera ici...</div>
    <div id="perf-metrics" class="metrics">Prêt.</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
