<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Document & Contract Summarizer ⚡</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="border-b border-slate-800 bg-slate-950/80 p-4 sticky top-0 backdrop-blur z-10">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-2xl">📜</span>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-emerald-300 bg-clip-text text-transparent">AI Legal & Contract Summarizer</h1>
          <p class="text-xs text-slate-400">Commercial MVP Reference: Malt (€2,500 - €5,000)</p>
        </div>
      </div>
      <a href="../../index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-slate-300 transition">← Back to Hub</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full flex-1 p-4 grid grid-cols-1 md:grid-cols-12 gap-6">
    <!-- Document Input Column -->
    <section class="md:col-span-6 bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <label htmlFor="doc-input" class="font-semibold text-slate-200">Contract / Document Raw Text</label>
        <button id="btn-load-sample" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 px-2.5 py-1 rounded text-slate-300 transition">Load Sample MSA</button>
      </div>

      <textarea id="doc-input" rows="14" aria-label="Contract / Document Raw Text" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500 font-mono text-xs leading-relaxed" placeholder="Paste legal contract or document text here for instant AI clause extraction and risk analysis..."></textarea>

      <div class="flex justify-between items-center pt-2">
        <span id="parsing-speed" class="text-[10px] bg-amber-950 text-amber-300 border border-amber-800 px-2 py-0.5 rounded font-mono hidden">Parsed in 0.00ms</span>
        <button id="btn-analyze" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition focus:ring-2 focus:ring-amber-400 ml-auto">
          ⚡ Analyze & Extract Risk Clauses
        </button>
      </div>
    </section>

    <!-- Analysis Results Column -->
    <section class="md:col-span-6 bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h2 class="font-semibold text-slate-200">AI Risk Assessment & Key Clauses</h2>
        <span id="risk-score" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full font-bold">Unanalyzed</span>
      </div>

      <!-- Key Clauses List -->
      <div id="clauses-container" class="flex-1 overflow-y-auto space-y-3 max-h-[500px] pr-1">
        <div class="text-sm text-slate-500 italic p-4 text-center">
          No document analyzed yet. Click "Load Sample MSA" and analyze.
        </div>
      </div>
    </section>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
